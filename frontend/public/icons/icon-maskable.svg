<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- bg-spark (135deg) on one 20 x 70 seat -->
    <linearGradient id="spark" gradientUnits="userSpaceOnUse" x1="-12.5" y1="12.5" x2="32.5" y2="57.5">
      <stop offset="0" stop-color="#7C5CFF" />
      <stop offset="1" stop-color="#FF4FD8" />
    </linearGradient>
    <rect id="seat" width="20" height="70" rx="5" fill="url(#spark)" />
  </defs>
  <!-- Full bleed; the mark stays inside the centre 80% so any mask shape keeps it whole. -->
  <rect width="512" height="512" fill="#0B0A10" />
  <g transform="translate(119.2 130) scale(3.6)">
    <use href="#seat" />
    <use href="#seat" x="28" />
    <use href="#seat" x="56" />
  </g>
</svg>
