name: Task
description: A piece of work under a story, or a chore
labels: ["type: task"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent story
      placeholder: "#12"
  - type: textarea
    id: todo
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
