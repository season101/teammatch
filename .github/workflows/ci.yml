name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # jobs below skip until backend/ and frontend/ have code
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: teammatch
          POSTGRES_USER: teammatch
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teammatch" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://teammatch:ci-only@localhost:5432/teammatch
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: schema is up to date
        run: |
          uv run python manage.py spectacular --file schema.yml --validate
          git diff --exit-code schema.yml

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: api client matches schema
        run: |
          pnpm run gen:api
          git diff --exit-code ../packages/api-client

  docker:
    needs: [detect, backend, frontend]
    if: always() && !failure() && !cancelled() && (needs.detect.outputs.backend == 'true' || needs.detect.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build api image
        if: needs.detect.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
      - name: build web image
        if: needs.detect.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
