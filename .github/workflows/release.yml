name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Release only a commit CI passed. A tag pushed right after a merge waits for main's CI run.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1"
          for i in $(seq 60); do
            out=$(gh api "$runs" --jq '.workflow_runs[0] | "\(.status // "missing") \(.conclusion // "none") \(.html_url // "")"') ||
              out="unreachable none"
            read -r status conclusion url <<<"$out"
            if [[ $status == completed ]]; then
              if [[ $conclusion == success ]]; then
                echo "CI passed on $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended $conclusion, so this tag isn't released: $url"
              exit 1
            fi
            echo "CI on $GITHUB_SHA: $status, checking again in 30 s ($i/60)"
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA after 30 minutes"
          exit 1

  images:
    needs: ci-passed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: web
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/teammatch-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        # GitHub's "Draft a new release" button makes the Release and the tag together, so it may exist already
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  deploy:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    # a called workflow gets no secrets, not even its environment's, unless they're passed
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
