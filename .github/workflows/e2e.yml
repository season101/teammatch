name: E2E

# The Playwright tests in e2e/ against the whole local stack (PL-08, PL-14).
on:
  push:
    branches: [main]
  # PRs that change the tests or what they run on; every other PR is covered after merge.
  pull_request:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "compose.local.yml"
      - "backend/config/settings/local.py"
  schedule:
    - cron: "0 8 * * *" # nightly, 2 am Central
  workflow_dispatch:

# a new push to a PR cancels its older run; main, nightly and manual runs each get their own group
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: throwaway .env
        run: |
          cp .env.example .env && echo >> .env
          pw() { openssl rand -hex 16; }
          for kv in "POSTGRES_PASSWORD=$(pw)" "S3_ACCESS_KEY=$(pw)" "S3_SECRET_KEY=$(pw)" \
            "SEED_OWNER_EMAIL=e2e.owner@latech.edu" "SEED_OWNER_PASSWORD=$(pw)" \
            "SEED_CANDIDATE_EMAIL=e2e.candidate@latech.edu" "SEED_CANDIDATE_PASSWORD=$(pw)" \
            "EMAIL_FILE_PATH=/app/.e2e-mail" "E2E_NO_RATE_LIMITS=1"; do
            sed -i "/^${kv%%=*}=/d" .env
            echo "$kv" >> .env
          done

      # --wait counts the one-shot storage-init exiting as a failure, so it waits for web and
      # what web needs, and storage-init (the media bucket) runs on its own.
      - name: start the stack
        run: |
          docker compose -f compose.local.yml up -d --build --wait web
          docker compose -f compose.local.yml run --rm storage-init

      - name: migrate and seed
        run: |
          docker compose -f compose.local.yml exec -T api python manage.py migrate --noinput
          docker compose -f compose.local.yml exec -T api python manage.py shell -c "$ACTIVE_TERM"
          docker compose -f compose.local.yml exec -T api python manage.py seed_demo
        env:
          # bootstrap only adds real terms. Past the last one, a fresh runner gets a test term
          # around today, so nightly runs don't stop when a term ends. CI only.
          ACTIVE_TERM: >-
            import datetime as d; from django.utils import timezone as tz;
            from apps.core.models import Term; from apps.projects.services import get_active_term;
            t = tz.localdate();
            get_active_term() or Term.objects.create(name=f"E2E {t}",
            start_date=t - d.timedelta(days=1), end_date=t + d.timedelta(days=30))

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock

      - name: install chromium
        working-directory: e2e
        run: uv run playwright install --with-deps chromium

      - name: run the tests
        working-directory: e2e
        run: uv run pytest

      - name: upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: api and web logs
        if: failure()
        run: docker compose -f compose.local.yml logs --no-color --tail 300 api web

      - name: stop the stack
        if: always()
        run: docker compose -f compose.local.yml down -v
