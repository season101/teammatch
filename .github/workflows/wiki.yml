name: Wiki

# Mirrors docs/ to the GitHub wiki. PRs only build (to catch broken links); main pushes.
on:
  pull_request:
    paths: ["docs/**", README.md, deploy/README.md, packages/api-client/README.md, .github/scripts/build_wiki.py, .github/workflows/wiki.yml]
  push:
    branches: [main]
    paths: ["docs/**", README.md, deploy/README.md, packages/api-client/README.md, .github/scripts/build_wiki.py, .github/workflows/wiki.yml]
  workflow_dispatch:

concurrency:
  group: wiki-${{ github.ref }}

permissions:
  contents: write # push to the wiki repo

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build pages
        run: python3 .github/scripts/build_wiki.py "$RUNNER_TEMP/pages"
      - name: push to the wiki
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/pages/." .
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Sync from ${GITHUB_SHA::7}"
          git push
