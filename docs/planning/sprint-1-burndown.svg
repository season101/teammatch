<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Sprint 1 burn-down: 36 hours left from Oct 6 through Oct 13, 31 on Oct 14, 23 on Oct 15, 4 on Oct 16 and Oct 17, 3 on Oct 18. The ideal line falls evenly from 36 on Oct 6 to 0 on Oct 20." font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="70" y1="30" x2="870" y2="30"/>
    <line x1="70" y1="110" x2="870" y2="110"/>
    <line x1="70" y1="190" x2="870" y2="190"/>
    <line x1="70" y1="270" x2="870" y2="270"/>
  </g>
  <line x1="70" y1="350" x2="870" y2="350" stroke="#bfbfbf" stroke-width="1.5"/>
  <g font-size="13" fill="#595959" text-anchor="end">
    <text x="60" y="34">40 h</text>
    <text x="60" y="114">30 h</text>
    <text x="60" y="194">20 h</text>
    <text x="60" y="274">10 h</text>
    <text x="60" y="354">0 h</text>
  </g>
  <g font-size="13" fill="#595959" text-anchor="middle">
    <text x="70" y="372">Oct 6</text>
    <text x="184.3" y="372">Oct 8</text>
    <text x="298.6" y="372">Oct 10</text>
    <text x="412.9" y="372">Oct 12</text>
    <text x="527.1" y="372">Oct 14</text>
    <text x="641.4" y="372">Oct 16</text>
    <text x="755.7" y="372">Oct 18</text>
    <text x="870" y="372">Oct 20</text>
  </g>
  <line x1="70" y1="62" x2="870" y2="350" stroke="#a5a5a5" stroke-width="2" stroke-dasharray="8 6"/>
  <polyline fill="none" stroke="#4472c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="70,62 127.1,62 184.3,62 241.4,62 298.6,62 355.7,62 412.9,62 470,62 527.1,102 584.3,166 641.4,318 698.6,318 755.7,326"/>
  <circle cx="755.7" cy="326" r="4.5" fill="#4472c4"/>
  <g font-size="14" fill="#000000">
    <text x="625" y="300" text-anchor="end">Oct 16: 8 stories merged (−19 h)</text>
    <text x="735" y="222" fill="#c00000">3 h left: 3 open chores</text>
  </g>
  <g font-size="13" fill="#000000">
    <line x1="560" y1="398" x2="590" y2="398" stroke="#4472c4" stroke-width="3"/>
    <text x="598" y="402">Actual hours left</text>
    <line x1="730" y1="398" x2="760" y2="398" stroke="#a5a5a5" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="768" y="402">Ideal</text>
  </g>
</svg>
