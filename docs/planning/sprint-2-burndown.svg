<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Sprint 2 burn-down: 39 hours left on Oct 22, 37 on Oct 23, 29 on Oct 24, 26 on Oct 25, 25 from Oct 26 through Oct 28, 19 on Oct 29, 8 on Oct 30 and Oct 31, 5 on Nov 1, and 2 on Nov 2 and Nov 3. The ideal line falls evenly from 39 on Oct 22 to 0 on Nov 3." font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="70" y1="30" x2="870" y2="30"/>
    <line x1="70" y1="110" x2="870" y2="110"/>
    <line x1="70" y1="190" x2="870" y2="190"/>
    <line x1="70" y1="270" x2="870" y2="270"/>
  </g>
  <line x1="70" y1="350" x2="870" y2="350" stroke="#bfbfbf" stroke-width="1.5"/>
  <g font-size="13" fill="#595959" text-anchor="end">
    <text x="60" y="34">40 h</text>
    <text x="60" y="114">30 h</text>
    <text x="60" y="194">20 h</text>
    <text x="60" y="274">10 h</text>
    <text x="60" y="354">0 h</text>
  </g>
  <g font-size="13" fill="#595959" text-anchor="middle">
    <text x="70" y="372">Oct 22</text>
    <text x="203.3" y="372">Oct 24</text>
    <text x="336.7" y="372">Oct 26</text>
    <text x="470" y="372">Oct 28</text>
    <text x="603.3" y="372">Oct 30</text>
    <text x="736.7" y="372">Nov 1</text>
    <text x="870" y="372">Nov 3</text>
  </g>
  <line x1="70" y1="38" x2="870" y2="350" stroke="#a5a5a5" stroke-width="2" stroke-dasharray="8 6"/>
  <polyline fill="none" stroke="#4472c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="70,38 136.7,54 203.3,118 270,142 336.7,150 403.3,150 470,150 536.7,198 603.3,286 670,286 736.7,310 803.3,334 870,334"/>
  <circle cx="870" cy="334" r="4.5" fill="#4472c4"/>
  <g font-size="14" fill="#000000">
    <text x="590" y="304" text-anchor="end">Oct 30: 5 issues closed (−11 h)</text>
    <text x="470" y="128" text-anchor="middle">Oct 26–28: 25 h left, no stories closed</text>
    <text x="860" y="262" text-anchor="end" fill="#c00000">2 h left: PL-11 and PL-14</text>
  </g>
  <g font-size="13" fill="#000000">
    <line x1="560" y1="398" x2="590" y2="398" stroke="#4472c4" stroke-width="3"/>
    <text x="598" y="402">Actual hours left</text>
    <line x1="730" y1="398" x2="760" y2="398" stroke="#a5a5a5" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="768" y="402">Ideal</text>
  </g>
</svg>
