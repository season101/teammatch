openapi: 3.0.3
info:
  title: TeamMatch API
  version: 1.0.0
  description: Role-based team formation for CSC 5323.
paths:
  /api/v1/feed/:
    get:
      operationId: feed_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - feed
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedRoleList'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Check:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: number
          format: double
        error:
          type: string
          nullable: true
      required:
      - error
      - latency_ms
      - ok
    Checks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/Check'
        redis:
          $ref: '#/components/schemas/Check'
      required:
      - database
      - redis
    FeedProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        pitch:
          type: string
          maxLength: 2000
      required:
      - id
      - pitch
      - title
    FeedRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        project:
          allOf:
          - $ref: '#/components/schemas/FeedProject'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - project
      - title
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        version:
          type: string
        checks:
          $ref: '#/components/schemas/Checks'
      required:
      - checks
      - status
      - version
    PaginatedFeedRoleList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/FeedRole'
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
