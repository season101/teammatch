openapi: 3.0.3
info:
  title: TeamMatch API
  version: 1.0.0
  description: Role-based team formation for CSC 5323.
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/projects/:
    post:
      operationId: projects_create
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
components:
  schemas:
    Check:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: number
          format: double
        error:
          type: string
          nullable: true
      required:
      - error
      - latency_ms
      - ok
    Checks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/Check'
        redis:
          $ref: '#/components/schemas/Check'
      required:
      - database
      - redis
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        version:
          type: string
        checks:
          $ref: '#/components/schemas/Checks'
      required:
      - checks
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        pitch:
          type: string
          maxLength: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/ProjectStatusEnum'
          readOnly: true
        term:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - pitch
      - status
      - term
      - title
    ProjectRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        pitch:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - pitch
      - title
    ProjectStatusEnum:
      enum:
      - draft
      - open
      - locked
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `open` - Open
        * `locked` - Locked
        * `archived` - Archived
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
