openapi: 3.0.3
info:
  title: TeamMatch API
  version: 1.0.0
  description: Role-based team formation for CSC 5323.
paths:
  /api/v1/applications/:
    post:
      operationId: applications_create
      description: 'Apply to an open role with an optional note. My own project: 403.'
      tags:
      - matching
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apply'
          description: ''
  /api/v1/applications/{id}/like/:
    post:
      operationId: applications_like_create
      description: |-
        Like or pass a pending applicant on my role.

        Not pending, or the applicant just joined another team: 409.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDecision'
          description: ''
  /api/v1/applications/{id}/pass/:
    post:
      operationId: applications_pass_create
      description: |-
        Like or pass a pending applicant on my role.

        Not pending, or the applicant just joined another team: 409.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDecision'
          description: ''
  /api/v1/applications/{id}/withdraw/:
    post:
      operationId: applications_withdraw_create
      description: 'Withdraw my pending application. Someone else''s: 404. Not pending:
        409 (BR-11).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyApplication'
          description: ''
  /api/v1/applications/mine/:
    get:
      operationId: applications_mine_list
      description: My applications, newest first. ?status= keeps one status (F3-06).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - liked
          - passed
          - pending
          - withdrawn
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyApplicationList'
          description: ''
  /api/v1/feed/:
    get:
      operationId: feed_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - feed
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedRoleList'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: GET or PATCH the signed-in user's own profile.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
    patch:
      operationId: me_profile_partial_update
      description: GET or PATCH the signed-in user's own profile.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
  /api/v1/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      description: Someone's public profile. Editing it is owner-only (403 otherwise).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_partial_update
      description: Someone's public profile. Editing it is owner-only (403 otherwise).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/projects/:
    get:
      operationId: projects_list
      description: 'GET: open projects in the current term, newest first. POST: create
        a draft.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectListList'
          description: ''
    post:
      operationId: projects_create
      description: 'GET: open projects in the current term, newest first. POST: create
        a draft.'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: |-
        GET: one project with its roles and their required skills.
        Owners see their own drafts. Everyone else sees open and locked projects only (404 otherwise).

        PATCH: the owner edits the title or pitch of a draft or open project.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: projects_partial_update
      description: |-
        GET: one project with its roles and their required skills.
        Owners see their own drafts. Everyone else sees open and locked projects only (404 otherwise).

        PATCH: the owner edits the title or pitch of a draft or open project.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/close/:
    post:
      operationId: projects_close_create
      description: 'Close my project: it is archived and its pending applications
        are withdrawn.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/publish/:
    post:
      operationId: projects_publish_create
      description: Open my draft project for applications. Blocked when it has no
        roles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/roles/:
    post:
      operationId: projects_roles_create
      description: Add a role (with required skills) to one of my draft or open projects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/projects/mine/:
    get:
      operationId: projects_mine_list
      description: Projects I own, with their roles.
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyProject'
          description: ''
  /api/v1/roles/{id}/:
    patch:
      operationId: roles_partial_update
      description: Edit one of my open roles, including its required skills.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    delete:
      operationId: roles_destroy
      description: Delete one of my open roles. Locks the project if every other role
        is filled.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/roles/{id}/applications/:
    get:
      operationId: roles_applications_list
      description: 'Pending applicants for one of my roles. Not my project: 403.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleApplicationList'
          description: ''
  /api/v1/roles/{id}/dismiss/:
    post:
      operationId: roles_dismiss_create
      description: 'Pass on a role so it leaves my feed (BR-10). My own project: 403.
        Not open: 409.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - matching
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/skills/:
    get:
      operationId: skills_list
      description: The skill list for pickers. ?q= filters by name. Small list, so
        no paging.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Filter by name, ignoring case.
      tags:
      - skills
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
  /api/v1/teams/{id}/seen/:
    post:
      operationId: teams_seen_create
      description: 'I saw "It''s a Team!" for this team (DD-27). Repeats keep the
        first time. Not mine: 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/teams/mine/:
    get:
      operationId: teams_mine_retrieve
      description: 'My team this term, with my seen_at (F4-05). No team this term:
        team is null.'
      tags:
      - teams
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTeamResponse'
          description: ''
components:
  schemas:
    ApplicationDecision:
      type: object
      description: A like or pass, plus whether that like locked the team (F4-05).
      properties:
        id:
          type: integer
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        note:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        team_locked:
          type: boolean
          readOnly: true
        team_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - applicant
      - created_at
      - id
      - team_id
      - team_locked
    ApplicationRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        project:
          allOf:
          - $ref: '#/components/schemas/FeedProject'
          readOnly: true
      required:
      - id
      - project
      - title
    ApplicationStatusEnum:
      enum:
      - pending
      - liked
      - passed
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `liked` - Liked
        * `passed` - Passed
        * `withdrawn` - Withdrawn
    Apply:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: integer
        note:
          type: string
          maxLength: 300
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - status
    ApplyRequest:
      type: object
      properties:
        role:
          type: integer
        note:
          type: string
          maxLength: 300
      required:
      - role
    Check:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: number
          format: double
        error:
          type: string
          nullable: true
      required:
      - error
      - latency_ms
      - ok
    Checks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/Check'
        redis:
          $ref: '#/components/schemas/Check'
      required:
      - database
      - redis
    FeedProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        pitch:
          type: string
          maxLength: 2000
        owner_name:
          type: string
          readOnly: true
      required:
      - id
      - owner_name
      - pitch
      - title
    FeedRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        project:
          allOf:
          - $ref: '#/components/schemas/FeedProject'
          readOnly: true
        required_skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - project
      - required_skills
      - title
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        version:
          type: string
        checks:
          $ref: '#/components/schemas/Checks'
      required:
      - checks
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    MyApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ApplicationRole'
          readOnly: true
        note:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - updated_at
    MyProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - id
      - skills
    MyProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProjectStatusEnum'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MyRole'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - roles
      - title
    MyRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/RoleStatusEnum'
      required:
      - id
      - title
    MyTeam:
      type: object
      description: My team this term, from my seat on it (F4-05).
      properties:
        id:
          type: integer
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/TeamProject'
          readOnly: true
        term:
          allOf:
          - $ref: '#/components/schemas/TeamTerm'
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
          readOnly: true
        seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - id
      - members
      - project
      - seen_at
      - term
    MyTeamResponse:
      type: object
      properties:
        team:
          allOf:
          - $ref: '#/components/schemas/MyTeam'
          readOnly: true
          nullable: true
      required:
      - team
    PaginatedFeedRoleList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/FeedRole'
    PaginatedMyApplicationList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/MyApplication'
    PaginatedProjectListList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectList'
    PaginatedRoleApplicationList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoleApplication'
    PatchedMyProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skill_ids:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
          maxItems: 20
    PatchedProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skill_ids:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
          maxItems: 20
    PatchedProjectRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
