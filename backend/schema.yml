openapi: 3.0.3
info:
  title: TeamMatch API
  version: 1.0.0
  description: Role-based team formation for CSC 5323.
paths:
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: GET or PATCH the signed-in user's own profile.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
    patch:
      operationId: me_profile_partial_update
      description: GET or PATCH the signed-in user's own profile.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMyProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
  /api/v1/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      description: Someone's public profile. Editing it is owner-only (403 otherwise).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profiles_partial_update
      description: Someone's public profile. Editing it is owner-only (403 otherwise).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/skills/:
    get:
      operationId: skills_list
      description: The skill list for pickers. ?q= filters by name. Small list, so
        no paging.
      tags:
      - skills
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
components:
  schemas:
    Check:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: number
          format: double
        error:
          type: string
          nullable: true
      required:
      - error
      - latency_ms
      - ok
    Checks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/Check'
        redis:
          $ref: '#/components/schemas/Check'
      required:
      - database
      - redis
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        version:
          type: string
        checks:
          $ref: '#/components/schemas/Checks'
      required:
      - checks
      - status
      - version
    MyProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - id
      - skills
    PatchedMyProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skill_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
    PatchedProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skill_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        major:
          type: string
          maxLength: 100
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
      required:
      - id
      - skills
    Skill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    SkillRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
